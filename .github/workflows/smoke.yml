name: Smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ${{ runner.temp }}/playwright/node_modules
            ~/.cache/ms-playwright
          key: playwright-1.62.1-${{ runner.os }}-chromium
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.62.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run the smoke test
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/playwright
        run: node test/smoke.mjs
